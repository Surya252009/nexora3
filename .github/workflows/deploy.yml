
name: NEXORA Auto Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Extract NEXORA ZIP automatically
        run: |
          mkdir -p extracted _site
          unzip -q NEXORA_GitHub_READY.zip -d extracted

          INDEX=$(find extracted -type f -name index.html | head -n 1)

          if [ -z "$INDEX" ]; then
            echo "ERROR: index.html not found inside ZIP"
            exit 1
          fi

          SITE_DIR=$(dirname "$INDEX")
          cp -a "$SITE_DIR/." _site/

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy NEXORA
        id: deployment
        uses: actions/deploy-pages@v4
